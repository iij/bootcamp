---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - services
  - pods
  - endpoints # v1 Endpoints is deprecated in v1.33+
  verbs: ["get", "list", "watch"]
- apiGroups:
    - discovery.k8s.io
  resources:
    - endpointslices
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
